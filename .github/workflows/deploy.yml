# Publica a app a cada push no main:
#  - Firebase Hosting (https://studio-8989371642-d7cae.web.app)
#  - GitHub Pages (https://chronicai-cespu.github.io)
#    Requer Settings → Pages → Source: GitHub Actions
#
# Requer o segredo FIREBASE_SERVICE_ACCOUNT (JSON da conta de serviço do projeto):
# Consola Firebase → Definições do projeto → Contas de serviço → Gerar nova chave privada
# GitHub → Settings → Secrets and variables → Actions → New repository secret
name: Deploy da app

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ vars.RECAPTCHA_SITE_KEY }}

      - name: Guardar o site para o GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Publicar o site (Firebase Hosting)
        run: |
          set -o pipefail
          if ! npx --yes firebase-tools@14 deploy --only hosting \
              --project studio-8989371642-d7cae --non-interactive 2>&1 | tee deploy.log; then
            grep -iE "error|denied|permission|disabled|not enabled|403|404" deploy.log \
              | head -15 | sed 's/^/::error::/'
            exit 1
          fi

      # As regras do Firestore exigem permissões extra na conta de serviço.
      # Se falhar, publique o ficheiro firestore.rules na consola
      # (Firestore → Regras → colar → Publicar); o site fica publicado na mesma.
      - name: Publicar regras do Firestore (opcional)
        continue-on-error: true
        run: |
          set -o pipefail
          if ! npx --yes firebase-tools@14 deploy --only firestore:rules \
              --project studio-8989371642-d7cae --non-interactive 2>&1 | tee rules.log; then
            echo "::warning::Regras não publicadas automaticamente. Publique firestore.rules na consola do Firebase."
            exit 1
          fi

  github-pages:
    needs: deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
